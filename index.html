<div id="root">
  <!-- Splash screen — shown instantly, replaced when React mounts -->
  <style>
    .wa-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #07110d;
    }
    .wa-splash img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      animation: wa-pulse 1.4s ease-in-out infinite;
    }
    .wa-splash p {
      margin-top: 1.2rem;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      color: #c9a84c;
      opacity: 0.85;
    }
    .wa-splash .wa-dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 3px;
      border-radius: 50%;
      background: #c9a84c;
      animation: wa-bounce 1.2s ease-in-out infinite;
    }
    .wa-splash .wa-dots span:nth-child(2) { animation-delay: 0.2s; }
    .wa-splash .wa-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes wa-pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes wa-bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-8px); opacity: 1; }
    }
  </style>
  <div class="wa-splash">
    <img src="/photos/logo-header.webp" alt="WILDS AURA" />
    <p>WILDS AURA</p>
    <div class="wa-dots">
